server:
  port: 8080

spring:
  application:
    name: api-gateway

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

zuul:
  routes:
    flights:
      path: /flights/**
      serviceId: flight-service
    hotels:
      path: /hotels/**
      serviceId: hotel-service
    cars:
      path: /cars/**
      serviceId: car-rental-service